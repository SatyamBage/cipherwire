<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroTrust Chat</title>
    <style>
        /* --- Frost Glass & Modern Minimalist Theme --- */
        :root {
            /* Glassmorphism Base */
            --glass-bg: rgba(17, 17, 20, 0.6); /* Translucent dark surface */
            --glass-border: rgba(255, 255, 255, 0.06); /* Subtle highlight edge */
            --blur-amount: 16px; /* Intensity of the frost effect */
            
            /* Clean Modern Colors (Cool Palette) */
            --color-primary: #3498db; /* Sleek Blue */
            --color-primary-dim: rgba(52, 152, 219, 0.2);
            --color-on-primary: #ffffff;
            --color-background: #08090a; /* Dark base behind glass */
            --color-text: #ececed;
            --color-outline: rgba(255, 255, 255, 0.3);
            --color-error: #e74c3c;
            --color-success: #2ecc71;
            
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: var(--font-family); 
            background-color: var(--color-background); 
            /* Subtle cool-toned gradient context for the blur effect */
            background-image: 
                radial-gradient(at 10% 10%, rgba(52, 152, 219, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(155, 89, 182, 0.1) 0px, transparent 50%);
            color: var(--color-text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            letter-spacing: -0.01em;
        }

        /* Reusable Glass Effect Class */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        /* --- Login Screen --- */
        #login-screen { 
            padding: 50px; 
            border-radius: var(--border-radius-lg); 
            width: 420px; 
            text-align: center; 
        }
        #login-screen h2 { margin-bottom: 8px; color: var(--color-primary); font-weight: 700; font-size: 2em; }
        #login-screen p { margin-bottom: 35px; font-size: 0.95em; color: var(--color-outline); }
        
        .input-field { 
            width: 100%; 
            padding: 16px 20px; 
            border-radius: var(--border-radius-md); 
            border: 1px solid var(--color-outline); 
            background: rgba(0,0,0,0.2); 
            color: var(--color-text); 
            font-size: 16px; 
            margin-bottom: 20px; 
            outline: none; 
            transition: var(--transition); 
        }
        .input-field:focus { border-color: var(--color-primary); background: rgba(0,0,0,0.4); }
        
        .btn-primary { 
            width: 100%; 
            padding: 16px; 
            border-radius: var(--border-radius-md); 
            background: var(--color-primary); 
            color: var(--color-on-primary); 
            font-size: 16px; 
            font-weight: 600; 
            border: none; 
            cursor: pointer; 
            transition: var(--transition); 
            box-shadow: 0 4px 15px var(--color-primary-dim);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px var(--color-primary-dim); }
        #login-status { margin-top: 20px; font-size: 0.9em; font-weight: 500;}

        /* --- Main Chat App Layout --- */
        #app-layout { display: none; width: 100%; height: 100%; }
        
        /* --- Sidebar (Left Panel) --- */
        #sidebar { 
            width: 340px; 
            border-right: 1px solid var(--glass-border); 
            display: flex; 
            flex-direction: column; 
            /* Subtle frosted sidebar background */
            background: rgba(10, 10, 12, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .sidebar-header { padding: 25px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { font-size: 1.1em; font-weight: 600; color: #fff; }
        .burn-btn { background: rgba(231, 76, 60, 0.2); color: var(--color-error); border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.85em; font-weight: 700; transition: var(--transition); }
        .burn-btn:hover { background: var(--color-error); color: white; }
        
        #contact-list { flex: 1; overflow-y: auto; padding: 15px; }
        #contact-list::-webkit-scrollbar { width: 4px; }
        #contact-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 2px; }

        .contact { padding: 15px; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: center; gap: 15px; margin-bottom: 8px; transition: var(--transition); color: var(--color-outline); border: 1px solid transparent; }
        .contact:hover { background: rgba(255,255,255,0.03); color: var(--color-text); }
        .contact.active { background: var(--color-primary-dim); color: var(--color-primary); border-color: rgba(52, 152, 219, 0.2); font-weight: 600; }
        
        .contact-avatar { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; font-size: 1.2em; font-weight: 700; color: var(--color-outline); transition: var(--transition); }
        .contact.active .contact-avatar { background: var(--color-primary); color: white; box-shadow: 0 4px 10px var(--color-primary-dim); }
        .unread-badge { background: var(--color-error); color: white; border-radius: 8px; padding: 2px 7px; font-size: 0.75em; font-weight: 800; margin-left: auto; display: none; }

        /* --- Chat Area (Right Panel) --- */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: transparent; }
        
        /* Frosted Chat Header */
        .chat-header { 
            padding: 18px 30px; 
            border-bottom: 1px solid var(--glass-border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .chat-header h3 { font-size: 1.1em; font-weight: 600; color: #fff; }
        
        /* Minimalist Switch for E2EE */
        .e2e-toggle { display: flex; align-items: center; gap: 12px; font-size: 0.9em; font-weight: 600; }
        #e2e-label { transition: var(--transition); }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); border-radius: 34px; transition: .3s; border: 1px solid var(--glass-border); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #fff; border-radius: 50%; transition: .3s; opacity: 0.8; }
        input:checked + .slider { background-color: var(--color-primary); border-color: transparent; }
        input:checked + .slider:before { transform: translateX(22px); opacity: 1; }

        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 35px 50px; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            /* Let the background gradient show through the message area */
            background: transparent;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 3px; }

        .empty-state { margin: auto; color: var(--color-outline); text-align: center; font-size: 0.95em; line-height: 1.6; max-width: 300px; }
        
        /* Message Bubbles - Translucent and Minimal */
        .msg-row { display: flex; width: 100%; }
        .msg-row.sent { justify-content: flex-end; }
        .msg-row.received { justify-content: flex-start; }
        .msg-row.system { justify-content: center; }
        
        .bubble { 
            max-width: 65%; 
            padding: 14px 20px; 
            border-radius: 18px; 
            font-size: 0.95em; 
            line-height: 1.5; 
            word-wrap: break-word; 
            position: relative; 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        /* Sent: Subtle Blue Translucent */
        .bubble.sent { 
            background: rgba(52, 152, 219, 0.25); 
            color: #fff; 
            border-bottom-right-radius: 4px; 
            border: 1px solid rgba(52, 152, 219, 0.3);
        }
        /* Received: Frost Gray Translucent */
        .bubble.received { 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--color-text); 
            border-bottom-left-radius: 4px; 
            border: 1px solid var(--glass-border);
        }
        /* System Log */
        .bubble.system { 
            background: rgba(0,0,0,0.2); 
            color: var(--color-outline); 
            font-size: 0.85em; 
            font-weight: 600; 
            text-align: center; 
            border-radius: 10px;
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
        }
        
        .msg-meta { font-size: 0.75em; opacity: 0.6; margin-top: 6px; display: flex; justify-content: space-between; gap: 10px; }
        .msg-row.sent .msg-meta { color: #fff; }

        /* Frosted Input Area */
        .chat-input-area { 
            padding: 20px 30px; 
            border-top: 1px solid var(--glass-border); 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }
        #chatInput { 
            flex: 1; 
            padding: 16px 25px; 
            border-radius: 30px; 
            border: 1px solid var(--glass-border); 
            background: rgba(0,0,0,0.2); 
            color: var(--color-text); 
            font-size: 16px; 
            outline: none; 
            transition: var(--transition);
        }
        #chatInput:focus:not(:disabled) { border-color: var(--color-outline); background: rgba(0,0,0,0.4); }
        #chatInput:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-send { 
            background: var(--color-primary); 
            color: var(--color-on-primary); 
            border: none; 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 1.2em; 
            cursor: pointer; 
            transition: var(--transition); 
            box-shadow: 0 4px 10px var(--color-primary-dim);
        }
        .btn-send:hover { transform: scale(1.05) translateY(-1px); box-shadow: 0 6px 15px var(--color-primary-dim); }
        .btn-send:disabled { background: rgba(255,255,255,0.05); color: var(--color-outline); cursor: not-allowed; box-shadow: none; border: 1px solid var(--glass-border); }

    </style>
</head>
<body>

    <div id="login-screen" class="glass-panel">
        <h2>ZeroTrust Web</h2>
        <p>Ephemeral End-to-End Encrypted Node</p>
        <input type="text" id="nickInput" class="input-field" placeholder="Create an ephemeral nickname..." autocomplete="off" onkeypress="if(event.key === 'Enter') connect()">
        <button class="btn-primary" onclick="connect()">Initialize & Connect Securely</button>
        <p id="login-status"></p>
    </div>

    <div id="app-layout">
        
        <div id="sidebar">
            <div class="sidebar-header">
                <h3>👤 <span id="myNameDisplay"></span></h3>
                <button class="burn-btn" onclick="burnProtocol()" title="Shred keys and disconnect immediately">🔥 BURN</button>
            </div>
            <div id="contact-list">
                </div>
        </div>

        <div id="chat-area">
            <div class="chat-header glass-panel">
                <h3 id="activeChatName">Welcome</h3>
                <div class="e2e-toggle">
                    <span id="e2e-label" style="color: var(--color-success)">🛡️ Encrypted</span>
                    <label class="switch">
                        <input type="checkbox" id="encryptionToggle" checked onchange="toggleEncryption()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div id="messages">
                <div class="empty-state">
                    <h3>No Active Chat</h3>
                    <p>Select a peer from the sidebar to establish a secure, private session.</p>
                </div>
            </div>
            
            <div class="chat-input-area glass-panel">
                <input type="text" id="chatInput" placeholder="Select a peer to initialize messaging..." disabled autocomplete="off" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled title="Send secure message">🚀</button>
            </div>
        </div>

    </div>

    <script>
        /* --- Context Summary for Evaluator/AI Assistant ---
           Title: ZeroTrust Hybrid Cryptosystem LAN Chat
           Architecture: WebSocket (asyncio), RSA-2048 identity/key-wrapping, AES-256-GCM payload encryption.
           Web Node Context: This frontend utilizes native WebCrypto API. It generates *two* separate 2048-bit RSA keys
           in RAM on connection: one (RSASSA-PKCS1-v1_5) for identity signing, one (RSA-OAEP) for wrapping AES keys.
           This enforces strict separation of duties demanded by modern browsers.
           Current State: Upgraded UI to dynamic, stateful Glassmorphism aesthetic.
        */

        // --- STATE & DATA STRUCTURES (Retained from previous build) ---
        let ws;
        let myName = "";
        let signKeyPair = null; 
        let encKeyPair = null;  
        let peerKeys = {};      
        
        // Chat UI State
        let encryptionEnabled = true;
        let currentChat = "Global"; 
        // chatHistory structure: { "username": [ { sender: "alice", text: "hello", e2ee: true, time: "10:00" } ] }
        let chatHistory = { "Global": [] }; 
        let unreadCounts = {};

        // --- CRYPTO HELPERS (Retained) ---
        const ab2b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
        const b642ab = (b64) => {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        };
        const hex2ab = (hex) => new Uint8Array(hex.match(/[\da-f]{2}/gi).map(h => parseInt(h, 16))).buffer;
        const ab2hex = (buf) => Array.prototype.map.call(new Uint8Array(buf), x => ('00' + x.toString(16)).slice(-2)).join('');

        // --- UI RENDERERS (Updated for new aesthetic) ---
        function formatTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }

        function updateSidebar() {
            const list = document.getElementById("contact-list");
            list.innerHTML = "";
            
            // System Log Contact
            const globalDiv = document.createElement("div");
            globalDiv.className = `contact ${currentChat === "Global" ? 'active' : ''}`;
            globalDiv.onclick = () => selectChat("Global");
            globalDiv.innerHTML = `
                <div class="contact-avatar">🌐</div>
                <div>System Logs</div>
                <div class="unread-badge" style="display:${unreadCounts["Global"] ? 'block':'none'}">${unreadCounts["Global"]}</div>
            `;
            list.appendChild(globalDiv);

            // Add all peers
            for (const nick of Object.keys(peerKeys)) {
                const div = document.createElement("div");
                div.className = `contact ${currentChat === nick ? 'active' : ''}`;
                div.onclick = () => selectChat(nick);
                div.innerHTML = `
                    <div class="contact-avatar">${nick.charAt(0).toUpperCase()}</div>
                    <div>${nick}</div>
                    <div class="unread-badge" style="display:${unreadCounts[nick] ? 'block':'none'}">${unreadCounts[nick]}</div>
                `;
                list.appendChild(div);
            }
        }

        function selectChat(target) {
            currentChat = target;
            unreadCounts[target] = 0; 
            updateSidebar();
            
            document.getElementById("activeChatName").innerText = target === "Global" ? "🌐 System Logs" : `🔒 Chat: ${target}`;
            
            const input = document.getElementById("chatInput");
            const btn = document.getElementById("sendBtn");
            if (target === "Global") {
                input.disabled = true;
                btn.disabled = true;
                input.placeholder = "System logs are read-only.";
            } else {
                input.disabled = false;
                btn.disabled = false;
                input.placeholder = `Secure message to ${target}...`;
                input.focus();
            }
            
            renderMessages();
        }

        function renderMessages() {
            const box = document.getElementById("messages");
            box.innerHTML = "";
            
            const msgs = chatHistory[currentChat] || [];
            if (msgs.length === 0) {
                if(currentChat === "Global"){
                     box.innerHTML = `<div class="empty-state"><h3>Logs Clear</h3><p>Server events and cryptographic warnings appear here.</p></div>`;
                } else {
                     box.innerHTML = `<div class="empty-state"><h3>Secure Tunnel Active</h3><p>Your session with ${currentChat} is ready. Messages are encrypted locally before transmission.</p></div>`;
                }
                return;
            }

            msgs.forEach(m => {
                const row = document.createElement("div");
                let cssClass = m.sender === myName ? "sent" : "received";
                if (m.sender === "System") cssClass = "system";
                
                row.className = `msg-row ${cssClass}`;
                
                let securityIcon = m.e2ee ? "🛡️ E2EE" : "⚠️ Plaintext";
                if (m.sender === "System") securityIcon = "⚡ System";

                row.innerHTML = `
                    <div class="bubble ${cssClass}">
                        <div>${m.text}</div>
                        ${m.sender !== "System" ? `<div class="msg-meta"><span>${securityIcon}</span><span>${m.time}</span></div>` : ''}
                    </div>
                `;
                box.appendChild(row);
            });
            box.scrollTop = box.scrollHeight;
        }

        function saveMessage(chatId, sender, text, e2ee) {
            if (!chatHistory[chatId]) chatHistory[chatId] = [];
            chatHistory[chatId].push({ sender, text, e2ee, time: formatTime() });
            
            if (currentChat === chatId) {
                renderMessages();
            } else {
                unreadCounts[chatId] = (unreadCounts[chatId] || 0) + 1;
                updateSidebar();
            }
        }

        function toggleEncryption() {
            encryptionEnabled = document.getElementById("encryptionToggle").checked;
            const label = document.getElementById("e2e-label");
            if(encryptionEnabled) {
                label.innerText = "🛡️ Encrypted";
                label.style.color = "var(--color-success)";
            } else {
                label.innerText = "⚠️ Plaintext";
                label.style.color = "var(--color-error)";
            }
        }

        function burnProtocol() {
            ws.close();
            signKeyPair = null;
            encKeyPair = null;
            document.body.innerHTML = `<div style="text-align:center; padding-top:20%; font-size:1.8em; font-weight:700; color:var(--color-error); backdrop-filter:blur(20px); height:100vh;">🔥 PROTOCOL BURNED.<br><span style="font-size:0.6em; color:var(--color-text); font-weight:400; opacity:0.8;">RAM keys shredded. Identity destroyed. Session terminated.</span></div>`;
        }

        // --- CORE NETWORK LOGIC (Retained) ---
        async function connect() {
            // Automagic URL detection
            const SERVER_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
            myName = document.getElementById("nickInput").value.trim();
            if(!myName) return;

            document.getElementById("login-status").innerText = "[*] Generating Ephemeral Keys in RAM...";
            document.getElementById("login-status").style.color = "var(--color-primary)";
            
            // 1. Generate Browser Keys (Dual-Key Architecture enforced by WebCrypto)
            signKeyPair = await crypto.subtle.generateKey({ name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["sign", "verify"]);
            encKeyPair = await crypto.subtle.generateKey({ name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["encrypt", "decrypt"]);

            const signPubExp = await crypto.subtle.exportKey("spki", signKeyPair.publicKey);
            const encPubExp = await crypto.subtle.exportKey("spki", encKeyPair.publicKey);

            document.getElementById("login-status").innerText = "[*] Authenticating with Relay...";

            // 2. Connect WebSocket
            ws = new WebSocket(SERVER_URL);
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                // HandshakeIDENTIFY
                if (msg.type === "IDENTIFY") {
                    const challengeBuf = hex2ab(msg.challenge);
                    const signature = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", signKeyPair.privateKey, challengeBuf);
                    ws.send(JSON.stringify({ nickname: myName, client_type: "browser", public_key: ab2b64(signPubExp), enc_key: ab2b64(encPubExp), signature: ab2hex(signature) }));
                } 
                // Handshake AUTH_OK
                else if (msg.type === "AUTH_OK") {
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("app-layout").style.display = "flex";
                    document.getElementById("myNameDisplay").innerText = myName;
                    
                    saveMessage("Global", "System", "ZeroTrust Cryptographic Engine online. Public ID distributed.", false);

                    for (const [nick, data] of Object.entries(msg.peer_keys)) {
                        await importPeer(nick, data.enc_key);
                    }
                    updateSidebar();
                }
                else if (msg.type === "USER_JOINED") {
                    await importPeer(msg.nickname, msg.enc_key);
                    saveMessage("Global", "System", `Peer '${msg.nickname}' connected. RSA public key imported.`, false);
                    updateSidebar();
                }
                else if (msg.type === "USER_LEFT") {
                    delete peerKeys[msg.nickname.toLowerCase()];
                    saveMessage("Global", "System", `Peer '${msg.nickname}' disconnected. Key discarded.`, false);
                    if (currentChat === msg.nickname) selectChat("Global");
                    updateSidebar();
                }
                else if (msg.type === "SERVER_MSG") {
                    saveMessage("Global", "System", `[SERVER] ${msg.msg}`, false);
                }
                else if (msg.type === "ERROR") {
                    saveMessage("Global", "System", `[RELAY ERROR] ${msg.msg}`, false);
                }
                else if (msg.type === "MESSAGE") {
                    const sender = msg.from;
                    if (msg.plaintext_demo) {
                        saveMessage(sender, sender, msg.plaintext_demo, false);
                    } else {
                        // Hybrid Decryption Engine
                        try {
                            const plaintext = await decryptPayload(msg.encrypted_key, msg.nonce, msg.ciphertext);
                            saveMessage(sender, sender, plaintext, true);
                        } catch (e) {
                            saveMessage("Global", "System", `Integrity failure: Decryption failed for message from ${sender}. Payload may be tampered.`, false);
                        }
                    }
                }
            };

            ws.onclose = () => { saveMessage("Global", "System", "Relay connection lost. Ephemeral session terminated.", false); };
        }

        async function importPeer(nick, b64_enc_key) {
            const ab = b642ab(b64_enc_key);
            peerKeys[nick.toLowerCase()] = await crypto.subtle.importKey("spki", ab, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);
        }

        async function encryptPayload(plaintext, targetNick) {
            const targetKey = peerKeys[targetNick.toLowerCase()];
            if (!targetKey) throw new Error("Key not found");
            
            // Hybrid Encryption Engine
            // 1. Volatile AES-256-GCM Session Key
            const sessionKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
            
            // 2. Encrypt Payload
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, sessionKey, new TextEncoder().encode(plaintext));
            
            // 3. Wrap AES key with Recipient's RSA Public Key (RSA-OAEP)
            const rawSessionKey = await crypto.subtle.exportKey("raw", sessionKey);
            const encSessionKey = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, targetKey, rawSessionKey);
            
            return { enc_key: ab2b64(encSessionKey), nonce: ab2b64(iv), ciphertext: ab2b64(ciphertext) };
        }

        async function decryptPayload(enc_key_b64, nonce_b64, ct_b64) {
            // 1. Unwrap AES key with our RSA Private Key
            const encSessionKey = b642ab(enc_key_b64);
            const rawSessionKey = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, encKeyPair.privateKey, encSessionKey);
            
            // 2. Import volatile AES key
            const sessionKey = await crypto.subtle.importKey("raw", rawSessionKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
            
            // 3. Decrypt Payload (Authentication tag check happens automatically)
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b642ab(nonce_b64) }, sessionKey, b642ab(ct_b64));
            return new TextDecoder().decode(decrypted);
        }

        async function sendMessage() {
            if (currentChat === "Global") return;
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if (!text) return;

            input.value = ""; 

            // Packet Sniffing Demonstration Mode
            if (!encryptionEnabled) {
                ws.send(JSON.stringify({ type: "MESSAGE", to: currentChat, encrypted_key: "", nonce: "", ciphertext: "", plaintext_demo: text }));
                saveMessage(currentChat, myName, text, false);
                return;
            }

            // Normal ZeroTrust Mode
            try {
                const payload = await encryptPayload(text, currentChat);
                ws.send(JSON.stringify({ type: "MESSAGE", to: currentChat, encrypted_key: payload.enc_key, nonce: payload.nonce, ciphertext: payload.ciphertext }));
                saveMessage(currentChat, myName, text, true);
            } catch (e) {
                saveMessage("Global", "System", `Cryptographic Engine Failure: Failed to encrypt message to ${currentChat}. Connection remains active but insecure.`, false);
            }
        }
    </script>
